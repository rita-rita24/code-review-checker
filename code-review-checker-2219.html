  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem('code-review-checker-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #172033;
      --muted: #697386;
      --border: #dce2ea;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --fix: #b42318;
      --fix-soft: #fff1f0;
      --warn: #b54708;
      --warn-soft: #fff7ed;
      --info: #175cd3;
      --info-soft: #eff6ff;
      --ok: #067647;
      --ok-soft: #ecfdf3;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      --editor-bg: #101827;
      --editor-text: #e5edf8;
      --gutter-bg: #0c1320;
      --gutter-text: #718096;
      --line-height: 22px;
      --radius: 14px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f131a;
      --panel: #171c24;
      --panel-soft: #1c222c;
      --text: #eef2f7;
      --muted: #9ca8b8;
      --border: #303844;
      --accent: #6ea8fe;
      --accent-soft: #1e3158;
      --fix: #ff8b82;
      --fix-soft: #43201f;
      --warn: #ffb866;
      --warn-soft: #3d2b16;
      --info: #8cb8ff;
      --info-soft: #1a2d4a;
      --ok: #6ce9a6;
      --ok-soft: #15372a;
      --shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
      --editor-bg: #0b111c;
      --editor-text: #e7edf7;
      --gutter-bg: #080d15;
      --gutter-text: #667085;
    }

    html[data-theme="light"] { color-scheme: light; }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      font-size: 14px;
    }

    button, textarea { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 96%, transparent);
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      backdrop-filter: blur(12px);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: block;
      object-fit: cover;
      flex: 0 0 auto;
      background: transparent !important;
      box-shadow: none !important;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-status {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .privacy-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .privacy-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--ok);
      box-shadow: 0 0 0 3px var(--ok-soft);
    }


    .theme-toggle {
      min-height: 34px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .theme-toggle:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      background: var(--panel);
    }

    .theme-toggle:active { transform: translateY(1px); }

    .theme-toggle:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent);
      outline-offset: 2px;
    }

    .theme-toggle-icon {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      font-size: 15px;
      line-height: 1;
    }

    .workspace {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, 0.65fr);
      gap: 16px;
      flex: 1 1 0;
      min-height: 0;
      height: auto;
      overflow: hidden;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
      overflow: hidden;
    }

    .editor-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }

    .panel-head {
      min-height: 58px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-weight: 700;
    }

    .language-tabs {
      display: inline-flex;
      gap: 6px;
      padding: 3px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .lang-btn {
      position: relative;
      min-height: 34px;
      padding: 0 14px;
      border-radius: 7px;
      background: transparent !important;
      border: 1px solid transparent;
      color: var(--muted);
      font-weight: 700;
      transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    .lang-btn:hover {
      color: var(--text);
      background: color-mix(in srgb, var(--panel) 55%, transparent) !important;
    }

    .lang-btn[aria-pressed="true"] {
      background: var(--accent-soft) !important;
      color: var(--accent);
      border: 1px solid var(--accent);
      background: var(--panel) !important;
      color: var(--accent);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ghost-btn {
      min-height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
    }

    .ghost-btn:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
    .ghost-btn:disabled { opacity: .45; cursor: default; }

    .editor-wrap {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      background: var(--editor-bg);
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
    }

    .gutter {
      background: var(--gutter-bg);
      color: var(--gutter-text);
      border-right: 1px solid rgba(255,255,255,.06);
      overflow: hidden;
      user-select: none;
      padding: 14px 0 28px;
      font: 13px/var(--line-height) ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .gutter-inner { will-change: transform; }

    .gutter-line {
      position: relative;
      height: var(--line-height);
      padding-right: 12px;
      text-align: right;
    }

    .gutter-line.has-issue::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warn);
    }

    .gutter-line.has-fix::before { background: #f97066; }
    .gutter-line.has-info::before { background: #84adff; }

    #codeInput {
      width: 100%;
      height: 100%;
      min-height: 0;
      resize: none;
      border: 0;
      outline: 0;
      margin: 0;
      padding: 14px 16px 28px;
      background: var(--editor-bg);
      color: var(--editor-text);
      caret-color: #9ec5ff;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      font: 13px/var(--line-height) ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      overscroll-behavior: contain;
    }

    #codeInput::placeholder { color: #617089; }
    #codeInput::selection { background: rgba(66, 133, 244, .35); }

    .editor-foot {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 6px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: var(--panel-soft);
      color: var(--muted);
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .review-panel {
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .review-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
    }

    .count-pill.fix { color: var(--fix); background: var(--fix-soft); }
    .count-pill.warn { color: var(--warn); background: var(--warn-soft); }
    .count-pill.info { color: var(--info); background: var(--info-soft); }

    .result-list {
      padding: 12px;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }

    .issue-card {
      width: 100%;
      text-align: left;
      padding: 12px 12px 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      margin-bottom: 9px;
      transition: 120ms ease;
    }

    .issue-card:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      transform: translateY(-1px);
      box-shadow: 0 7px 16px rgba(15, 23, 42, .07);
    }

    .line-card {
      width: 100%;
      text-align: left;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      margin-bottom: 10px;
      transition: 120ms ease;
    }

    .line-card:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      box-shadow: 0 7px 16px rgba(15, 23, 42, .07);
    }

    .line-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .line-code {
      margin: 0 0 10px;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      overflow-x: auto;
      color: var(--text);
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      white-space: pre;
    }

    .line-issues {
      display: grid;
      gap: 8px;
    }

    .line-issue {
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .line-issue:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .issue-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }

    .category-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .fix-example {
      margin-top: 6px;
      padding: 7px 9px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
      white-space: nowrap;
      overflow-x: auto;
    }

    .fix-example strong {
      color: var(--accent);
      margin-right: 6px;
    }

    .more-issues {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .issue-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      min-width: 0;
    }

    .level-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .level-chip.fix { color: var(--fix); background: var(--fix-soft); }
    .level-chip.warn { color: var(--warn); background: var(--warn-soft); }
    .level-chip.info { color: var(--info); background: var(--info-soft); }

    .line-label {
      color: var(--muted);
      font-size: 11px;
      margin-left: auto;
      white-space: nowrap;
    }

    .issue-title {
      font-weight: 780;
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .issue-message,
    .issue-suggestion {
      color: var(--muted);
      line-height: 1.65;
      font-size: 12.5px;
    }

    .issue-suggestion {
      margin-top: 5px;
      color: color-mix(in srgb, var(--text) 80%, var(--muted));
    }

    .issue-snippet {
      margin-top: 8px;
      padding: 7px 8px;
      border-radius: 7px;
      background: var(--panel-soft);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .empty-state {
      min-height: 320px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 30px 20px;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--ok-soft);
      color: var(--ok);
      font-size: 25px;
      font-weight: 900;
    }

    .empty-title {
      color: var(--text);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .empty-state[data-kind="waiting"] .empty-icon {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 16px);
      padding: 9px 12px;
      border-radius: 9px;
      background: #111827;
      color: #fff;
      box-shadow: 0 10px 28px rgba(0,0,0,.24);
      opacity: 0;
      pointer-events: none;
      transition: 160ms ease;
      z-index: 50;
      font-size: 12px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1.1fr) minmax(0, .9fr);
        height: auto;
        overflow: hidden;
      }
      .editor-panel, .review-panel { min-height: 0; height: 100%; }
      .editor-wrap, #codeInput { min-height: 0; }
      .review-panel { max-height: none; }
      .result-list { max-height: none; }
    }

    @media (max-width: 680px) {
      .topbar { align-items: flex-start; padding: 14px; }
      .privacy-badge { display: none; }
      .workspace { padding: 10px; gap: 10px; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; justify-content: flex-start; }
      .language-tabs { width: 100%; }
      .lang-btn { flex: 1; }
      .editor-wrap, #codeInput { min-height: 0; }
      .editor-foot { align-items: flex-start; flex-direction: column; }
      .subtitle { max-width: 56vw; }
      .theme-toggle-label { display: none; }
      .theme-toggle { width: 34px; padding: 0; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-wrap">
        <div>
          <h1>Code Review Checker</h1>
          
        </div>
      </div>
      <div class="top-status">
        <span class="privacy-badge" title="このHTMLは外部通信を行いません">Local only / 外部通信なし</span>
        <button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="ダークモードに切り替え" title="表示モードを切り替え">
          <span id="themeToggleIcon" class="theme-toggle-icon" aria-hidden="true">☀</span>
          <span id="themeToggleLabel" class="theme-toggle-label">ライト</span>
        </button>
      </div>
    </header>

    <section class="workspace">
      <section class="panel editor-panel" aria-label="コード入力">
        <div class="panel-head">
          <div class="language-tabs" role="group" aria-label="言語切替">
            <button type="button" class="lang-btn" data-language="java" aria-pressed="true">Java</button>
            <button type="button" class="lang-btn" data-language="javascript" aria-pressed="false">JavaScript</button>
          </div>
          <div class="actions">
            <button type="button" id="clearBtn" class="ghost-btn">クリア</button>
          </div>
        </div>

        <div class="editor-wrap">
          <div class="gutter" aria-hidden="true"><div id="gutterInner" class="gutter-inner"></div></div>
          <textarea id="codeInput" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="レビュー対象コード" placeholder="ここにコードを貼り付けてください。"></textarea>
        </div>

        <div class="editor-foot">
          <div>貼り付けたコードは保存しません。</div>
          
        </div>
      </section>

      <aside class="panel review-panel" aria-label="レビュー結果">
        <div class="panel-head">
          <div class="panel-title">レビュー結果</div>
          <div class="actions">
            <div id="summary" class="review-summary" aria-live="polite"></div>
            <button type="button" id="copyBtn" class="ghost-btn" disabled>結果をコピー</button>
          </div>
        </div>
        <div id="resultList" class="result-list"></div>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const REVIEW_DELAY_MS = 300;
      const LONG_LINE_LIMIT = 120;
      const MAX_ISSUES_PER_LINE = 3;
      const AMBIGUOUS_NAMES = new Set(['data', 'info', 'value', 'item', 'obj', 'object', 'tmp', 'temp', 'result']);
      const ALLOWED_SHORT_NAMES = new Set(['i', 'j', 'k', 'x', 'y', 'e']);
      const BOOLEAN_PREFIXES = ['is', 'has', 'can', 'should', 'needs', 'contains', 'exists', 'supports'];
      const METHOD_TYPE_SUFFIXES = ['String', 'Str', 'Int', 'Bool', 'Boolean', 'Array', 'List', 'Obj', 'Object'];
      const HUNGARIAN_PREFIXES = ['str', 'int', 'bool', 'arr', 'lst', 'obj'];
      const ABBREVIATIONS = {
        usr: 'user',
        cnt: 'count',
        msg: 'message',
        cfg: 'config'
      };

      const els = {
        code: document.getElementById('codeInput'),
        gutter: document.getElementById('gutterInner'),
        resultList: document.getElementById('resultList'),
        summary: document.getElementById('summary'),
        themeToggle: document.getElementById('themeToggle'),
        themeToggleIcon: document.getElementById('themeToggleIcon'),
        themeToggleLabel: document.getElementById('themeToggleLabel'),
        copyBtn: document.getElementById('copyBtn'),
        clearBtn: document.getElementById('clearBtn'),
        toast: document.getElementById('toast'),
        langBtns: Array.from(document.querySelectorAll('.lang-btn'))
      };

      let language = 'java';
      let reviewTimer = null;
      let lastIssues = [];
      let lastLex = null;
      let toastTimer = null;
      const THEME_STORAGE_KEY = 'code-review-checker-theme';

      function getTheme() {
        return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
      }

      function renderThemeToggle() {
        const isDark = getTheme() === 'dark';
        els.themeToggle.setAttribute('aria-pressed', String(isDark));
        els.themeToggle.setAttribute('aria-label', isDark ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
        els.themeToggleIcon.textContent = isDark ? '☾' : '☀';
        els.themeToggleLabel.textContent = isDark ? 'ダーク' : 'ライト';
      }

      function setTheme(theme, persist = true) {
        const nextTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = nextTheme;
        renderThemeToggle();
        if (persist) {
          try {
            localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
          } catch (_) {
            // localStorageが使えない環境でもテーマ切替自体は継続する。
          }
        }
      }

      function showToast(message) {
        els.toast.textContent = message;
        els.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1600);
      }


      function scheduleReview() {
        clearTimeout(reviewTimer);
        reviewTimer = setTimeout(runReview, REVIEW_DELAY_MS);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function levelLabel(level) {
        return level === 'fix' ? '要修正' : level === 'warn' ? '警告' : '情報';
      }

      function addIssue(issues, issue) {
        const line = Math.max(1, issue.line || 1);
        issues.push({
          level: 'warn',
          suggestion: '',
          message: '',
          endLine: line,
          ...issue,
          line,
          endLine: Math.max(line, issue.endLine || line)
        });
      }

      function isLowerCamel(name) {
        return /^[a-z][A-Za-z0-9]*$/.test(name);
      }

      function isPascal(name) {
        return /^[A-Z][A-Za-z0-9]*$/.test(name);
      }

      function isUpperSnake(name) {
        return /^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$/.test(name);
      }

      function startsWithBooleanPrefix(name) {
        return BOOLEAN_PREFIXES.some(prefix => name.startsWith(prefix) && name.length > prefix.length && /[A-Z]/.test(name[prefix.length]));
      }

      function toUpperSnake(name) {
        return name
          .replace(/([a-z0-9])([A-Z])/g, '$1_$2')
          .replace(/[-\s]+/g, '_')
          .replace(/__+/g, '_')
          .toUpperCase();
      }

      function countLeadingSpaces(line) {
        const match = line.match(/^[ ]*/);
        return match ? match[0].length : 0;
      }

      function lineSnippet(lines, line) {
        const raw = lines[line - 1] || '';
        return raw.trim().replace(/\s+/g, ' ').slice(0, 160);
      }

      function lexSource(source, lang) {
        const lines = source.split('\n');
        const noComments = [];
        const structural = [];
        const stringsByLine = lines.map(() => []);
        const comments = [];

        let state = 'code';
        let blockCommentStartLine = -1;
        let blockCommentText = '';
        let stringQuote = '';
        let stringStartLine = -1;
        let textBlock = false;

        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
          const line = lines[lineIndex];
          let nc = '';
          let st = '';
          let i = 0;
          let lineCommentText = '';
          let lineCommentStart = -1;

          while (i < line.length) {
            const ch = line[i];
            const next = line[i + 1] || '';
            const triple = line.slice(i, i + 3);

            if (state === 'blockComment') {
              if (ch === '*' && next === '/') {
                blockCommentText += '*/';
                nc += '  ';
                st += '  ';
                i += 2;
                state = 'code';
                comments.push({
                  type: 'block',
                  startLine: blockCommentStartLine + 1,
                  endLine: lineIndex + 1,
                  text: blockCommentText
                });
                blockCommentText = '';
                blockCommentStartLine = -1;
              } else {
                blockCommentText += ch;
                nc += ch === '\t' ? '\t' : ' ';
                st += ch === '\t' ? '\t' : ' ';
                i++;
              }
              continue;
            }

            if (state === 'string') {
              const token = stringsByLine[lineIndex].find(t => t.open && t.end == null);

              if (textBlock) {
                if (triple === '"""') {
                  nc += '"""';
                  st += '   ';
                  if (token) { token.end = i + 3; token.text += '"""'; token.open = false; }
                  i += 3;
                  state = 'code';
                  textBlock = false;
                  stringQuote = '';
                } else {
                  nc += ch;
                  st += ch === '\t' ? '\t' : ' ';
                  if (token) token.text += ch;
                  i++;
                }
                continue;
              }

              if (ch === '\\') {
                nc += ch;
                st += ' ';
                if (token) token.text += ch;
                if (i + 1 < line.length) {
                  nc += line[i + 1];
                  st += line[i + 1] === '\t' ? '\t' : ' ';
                  if (token) token.text += line[i + 1];
                  i += 2;
                } else {
                  i++;
                }
                continue;
              }

              if (ch === stringQuote) {
                nc += ch;
                st += ' ';
                if (token) { token.end = i + 1; token.text += ch; token.open = false; }
                i++;
                state = 'code';
                stringQuote = '';
                continue;
              }

              nc += ch;
              st += ch === '\t' ? '\t' : ' ';
              if (token) token.text += ch;
              i++;
              continue;
            }

            if (ch === '/' && next === '/') {
              lineCommentStart = i;
              lineCommentText = line.slice(i);
              nc += ' '.repeat(line.length - i);
              st += ' '.repeat(line.length - i);
              i = line.length;
              break;
            }

            if (ch === '/' && next === '*') {
              state = 'blockComment';
              blockCommentStartLine = lineIndex;
              blockCommentText = '/*';
              nc += '  ';
              st += '  ';
              i += 2;
              continue;
            }

            if (lang === 'java' && triple === '"""') {
              state = 'string';
              stringQuote = '"';
              textBlock = true;
              stringStartLine = lineIndex;
              stringsByLine[lineIndex].push({ start: i, end: null, quote: '"""', text: '"""', open: true, startLine: stringStartLine });
              nc += '"""';
              st += '   ';
              i += 3;
              continue;
            }

            const isStringStart = lang === 'javascript'
              ? ch === "'" || ch === '"' || ch === '`'
              : ch === "'" || ch === '"';

            if (isStringStart) {
              state = 'string';
              stringQuote = ch;
              stringStartLine = lineIndex;
              stringsByLine[lineIndex].push({ start: i, end: null, quote: ch, text: ch, open: true, startLine: stringStartLine });
              nc += ch;
              st += ' ';
              i++;
              continue;
            }

            nc += ch;
            st += ch;
            i++;
          }

          if (lineCommentStart >= 0) {
            comments.push({ type: 'line', startLine: lineIndex + 1, endLine: lineIndex + 1, text: lineCommentText, startCol: lineCommentStart });
          }

          if (state === 'blockComment') blockCommentText += '\n';

          if (state === 'string' && !textBlock && stringQuote !== '`') {
            const token = stringsByLine[lineIndex].find(t => t.open && t.end == null);
            if (token) { token.end = line.length; token.open = false; }
            state = 'code';
            stringQuote = '';
          } else if (state === 'string' && stringQuote === '`') {
            const token = stringsByLine[lineIndex].find(t => t.open && t.end == null);
            if (token) { token.end = line.length; token.open = false; }
          }

          noComments.push(nc);
          structural.push(st);
        }

        if (state === 'blockComment' && blockCommentStartLine >= 0) {
          comments.push({
            type: 'block',
            startLine: blockCommentStartLine + 1,
            endLine: lines.length,
            text: blockCommentText
          });
        }

        return { lines, noComments, structural, stringsByLine, comments };
      }

      function groupLineComments(comments) {
        const grouped = [];
        const sorted = comments.slice().sort((a, b) => a.startLine - b.startLine);
        for (const comment of sorted) {
          if (comment.type !== 'line') {
            grouped.push(comment);
            continue;
          }
          const last = grouped[grouped.length - 1];
          if (last && last.type === 'line-group' && last.endLine + 1 === comment.startLine) {
            last.endLine = comment.endLine;
            last.text += '\n' + comment.text;
          } else {
            grouped.push({ type: 'line-group', startLine: comment.startLine, endLine: comment.endLine, text: comment.text });
          }
        }
        return grouped;
      }

      function looksLikeCommentedCode(text, lang) {
        const clean = text
          .replace(/^\/\*+/, '')
          .replace(/\*+\/$/, '')
          .split('\n')
          .map(line => line.replace(/^\s*\/\/\s?/, '').replace(/^\s*\*\s?/, '').trim())
          .join('\n')
          .trim();

        if (!clean || /^@\w+/.test(clean) || /^\w+\s*[:：]/.test(clean)) return false;
        if (lang === 'java' && /^(?:@param|@return|@throws|@see|@since|@author)\b/m.test(clean)) return false;

        const commonPatterns = [
          /\b(?:if|for|while|switch|return|new|throw|try|catch|class|function)\b\s*[({]?/,
          /\b[A-Za-z_$][\w$]*\s*=\s*[^=]/,
          /\b[A-Za-z_$][\w$]*\s*\([^)]*\)\s*;?/,
          /[;{}]/
        ];
        const javaPatterns = [/\b(?:public|private|protected|static|final|String|boolean|int|long|double|List|Set|Map)\b/];
        const jsPatterns = [/\b(?:const|let|var|async|await)\b/, /=>/];
        const patterns = commonPatterns.concat(lang === 'java' ? javaPatterns : jsPatterns);
        return patterns.some(pattern => pattern.test(clean));
      }

      function analyzeComments(lex, lang, issues) {
        const grouped = groupLineComments(lex.comments);
        for (const comment of grouped) {
          const text = comment.text || '';
          if (/\b(?:TODO|FIXME)\b/i.test(text)) {
            addIssue(issues, {
              level: 'info', line: comment.startLine, endLine: comment.endLine,
              title: 'TODO / FIXME コメントがあります',
              message: '未完了の作業や暫定対応が残っていないか確認してください。',
              suggestion: '不要なら削除し、必要ならチケットや対応方針と紐づけると追跡しやすくなります。'
            });
          }
          if (looksLikeCommentedCode(text, lang)) {
            addIssue(issues, {
              level: 'info', line: comment.startLine, endLine: comment.endLine,
              title: 'コメントアウトされたコードの可能性があります',
              message: 'コメント内のコードは通常ルールではチェックしていません。',
              suggestion: '不要なコードなら削除し、履歴はバージョン管理に任せるのがおすすめです。'
            });
          }
        }
      }

      function analyzeCommon(lex, lang, issues) {
        const { lines, noComments, structural } = lex;

        lines.forEach((line, index) => {
          if (line.replace(/\t/g, '  ').length > LONG_LINE_LIMIT) {
            addIssue(issues, {
              level: 'info', line: index + 1,
              title: `1行が${LONG_LINE_LIMIT}文字を超えています`,
              message: '横スクロールやレビュー時の読みづらさにつながります。',
              suggestion: '式や引数を適切な位置で改行してください。'
            });
          }
        });

        // Class names
        structural.forEach((line, index) => {
          const match = line.match(/\bclass\s+([A-Za-z_$][\w$]*)/);
          if (match && !isPascal(match[1])) {
            addIssue(issues, {
              level: 'fix', line: index + 1,
              title: `クラス名「${match[1]}」は PascalCase にしてください`,
              suggestion: '例: UserService / OrderController'
            });
          }
        });

        // Generic deep nesting by brace depth.
        let depth = 0;
        let deepReportedAt = -1;
        structural.forEach((line, index) => {
          const trimmed = line.trimStart();
          const closesFirst = trimmed.startsWith('}') ? 1 : 0;
          const effectiveDepth = Math.max(0, depth - closesFirst);
          if (effectiveDepth >= 4 && deepReportedAt !== effectiveDepth) {
            addIssue(issues, {
              level: 'info', line: index + 1,
              title: 'ネストが深くなっています',
              message: `現在のブロック深度はおよそ ${effectiveDepth} 階層です。`,
              suggestion: '早期return、処理の分割、条件式の整理を検討してください。'
            });
            deepReportedAt = effectiveDepth;
          }
          for (const ch of line) {
            if (ch === '{') depth++;
            if (ch === '}') depth = Math.max(0, depth - 1);
          }
          if (depth < 4) deepReportedAt = -1;
        });

        if (lang === 'java') analyzeJavaNaming(lex, issues);
        else analyzeJavaScriptNaming(lex, issues);
      }

      function checkVariableName(name, type, line, context, issues, options = {}) {
        if (!name || options.constant) return;

        if (AMBIGUOUS_NAMES.has(name)) {
          addIssue(issues, {
            level: 'info', line,
            title: `変数名「${name}」は意味が広すぎます`,
            message: '変数名だけで中身や役割が分かる名前を検討してください。',
            suggestion: '例: userProfile / activeUsers / validationResult'
          });
        }

        if (/flag$/i.test(name) || name.toLowerCase() === 'flag') {
          addIssue(issues, {
            level: 'warn', line,
            title: `「${name}」では true / false の意味が分かりにくいです`,
            suggestion: 'is / has / can / should など、状態を質問として読める名前を使ってください。'
          });
        }

        if (name.length === 1 && !ALLOWED_SHORT_NAMES.has(name)) {
          addIssue(issues, {
            level: 'warn', line,
            title: `1文字の変数名「${name}」は避けてください`,
            suggestion: '役割が分かる具体的な名前にしてください。'
          });
        }

        if (name.length === 1 && ALLOWED_SHORT_NAMES.has(name)) {
          const allowedContext = /\bfor\s*\(|=>|\bcatch\s*\(/.test(context);
          if (!allowedContext) {
            addIssue(issues, {
              level: 'info', line,
              title: `短い変数名「${name}」を確認してください`,
              message: 'ループ変数や短いコールバック以外では、具体名の方が読みやすくなります。'
            });
          }
        }

        if (!isLowerCamel(name) && name.length > 1 && !/^_/.test(name)) {
          addIssue(issues, {
            level: 'warn', line,
            title: `変数名「${name}」は lowerCamelCase にしてください`,
            suggestion: '例: userName / retryCount / activeUsers'
          });
        }

        for (const prefix of HUNGARIAN_PREFIXES) {
          if (new RegExp(`^${prefix}[A-Z]`).test(name)) {
            addIssue(issues, {
              level: 'info', line,
              title: `型を表す接頭辞「${prefix}」は変数名に不要です`,
              suggestion: '型ではなく、値の意味や役割を名前にしてください。'
            });
            break;
          }
        }

        for (const [abbr, full] of Object.entries(ABBREVIATIONS)) {
          const abbrPattern = new RegExp(`(^${abbr}(?=[A-Z_]|$)|_${abbr}(?=_|$))`, 'i');
          if (abbrPattern.test(name)) {
            addIssue(issues, {
              level: 'info', line,
              title: `略語「${abbr}」を避けてください`,
              suggestion: `「${full}」のように意味が分かる単語を使ってください。`
            });
            break;
          }
        }

        const booleanType = /^(?:boolean|Boolean)$/i.test(type || '');
        const booleanInitializer = /\b(?:true|false)\b|===|!==|==|!=|\binstanceof\b/.test(options.initializer || '');
        if ((booleanType || booleanInitializer) && !startsWithBooleanPrefix(name)) {
          addIssue(issues, {
            level: 'warn', line,
            title: `Boolean変数「${name}」は状態が分かる名前にしてください`,
            suggestion: '例: isActive / hasPermission / canEdit / shouldRetry'
          });
        }

        if (/^(?:isNot|hasNo|cannot|cant|shouldNot)[A-Z]/.test(name)) {
          addIssue(issues, {
            level: 'info', line,
            title: `否定形のBoolean名「${name}」は読み間違いに注意してください`,
            suggestion: '肯定形の状態名に置き換えられないか検討してください。'
          });
        }
      }

      function checkMethodName(name, line, returnType, previousLine, issues) {
        if (!name) return;
        if (!isLowerCamel(name)) {
          addIssue(issues, {
            level: 'fix', line,
            title: `メソッド名「${name}」は lowerCamelCase にしてください`,
            suggestion: '例: getUser / saveOrder / calculateTotal'
          });
        }

        const ambiguous = new Set(['process', 'execute', 'doSomething', 'handle']);
        if (ambiguous.has(name)) {
          addIssue(issues, {
            level: 'info', line,
            title: `メソッド名「${name}」は処理内容が伝わりにくい可能性があります`,
            suggestion: '何を処理するのかまで名前に含めてください。例: processOrder / handleLoginError'
          });
        }

        if (/^(?:boolean|Boolean)$/i.test(returnType || '') && !startsWithBooleanPrefix(name)) {
          addIssue(issues, {
            level: 'warn', line,
            title: `Booleanを返すメソッド「${name}」の名前を確認してください`,
            suggestion: 'is / has / can / should などから始めると意図が明確です。'
          });
        }

        const suffix = METHOD_TYPE_SUFFIXES.find(value => name.endsWith(value));
        if (suffix) {
          addIssue(issues, {
            level: 'info', line,
            title: `メソッド名に型情報「${suffix}」が含まれています`,
            suggestion: '型ではなく、返す値や処理の意味を名前にしてください。'
          });
        }
      }

      function analyzeJavaNaming(lex, issues) {
        const { structural, noComments } = lex;
        const stringVars = new Set();
        let enumDepth = null;
        let depth = 0;

        structural.forEach((line, index) => {
          const original = noComments[index];
          const lineNo = index + 1;
          const prev = index > 0 ? structural[index - 1] : '';

          const constantMatch = line.match(/\bstatic\s+final\s+[\w<>?, .\[\]]+\s+([A-Za-z_$][\w$]*)\s*(?:=|;)/);
          if (constantMatch && !isUpperSnake(constantMatch[1])) {
            addIssue(issues, {
              level: 'fix', line: lineNo,
              title: `Java定数「${constantMatch[1]}」は UPPER_SNAKE_CASE にしてください`,
              suggestion: `例: ${toUpperSnake(constantMatch[1])}`
            });
          }

          const methodMatch = line.match(/^\s*(?:@[\w().,\s]+\s*)*(?:(?:public|protected|private|static|final|synchronized|abstract|native|default)\s+)*([\w<>?, .\[\]]+)\s+([A-Za-z_$][\w$]*)\s*\([^;]*\)\s*(?:throws\s+[^\{]+)?\{/);
          if (methodMatch && !/\b(?:if|for|while|switch|catch)\s*$/.test(methodMatch[1])) {
            const returnType = methodMatch[1].trim().split(/\s+/).pop();
            const name = methodMatch[2];
            // Constructor has no return type; this regex can mistake it. Skip if name equals a known class on same file.
            const classNames = structural.map(v => (v.match(/\bclass\s+([A-Za-z_$][\w$]*)/) || [])[1]).filter(Boolean);
            if (!classNames.includes(name)) checkMethodName(name, lineNo, returnType, prev, issues);
          }

          const declaration = line.match(/\b([A-Za-z_$][\w$]*(?:\s*<[^;=]+>)?(?:\[\])?)\s+([A-Za-z_$][\w$]*)\s*(?:=\s*([^;]+))?;/);
          if (declaration && !/\b(?:return|new|throw|case)\b/.test(line.slice(0, declaration.index))) {
            const type = declaration[1].replace(/\s+/g, ' ').trim();
            const name = declaration[2];
            const initializer = declaration[3] || '';
            const isConstant = /\bstatic\s+final\b/.test(line);
            checkVariableName(name, type, lineNo, original, issues, { initializer, constant: isConstant });
            if (/^String(?:\[\])?$/.test(type)) stringVars.add(name);

            if (/^(?:List|Set|Collection|ArrayList|HashSet|LinkedList|Iterable|Stream)\b/.test(type) && !/(?:s|List|Set|Collection)$/.test(name)) {
              addIssue(issues, {
                level: 'warn', line: lineNo,
                title: `コレクション変数「${name}」は複数形が分かる名前にしてください`,
                suggestion: '例: users / userList / orderIds'
              });
            }
          }

          const enumStart = line.match(/\benum\s+[A-Za-z_$][\w$]*\s*\{/);
          if (enumStart) enumDepth = depth + 1;
          if (enumDepth != null && depth >= enumDepth) {
            const enumValue = line.match(/^\s*([A-Za-z_$][\w$]*)\s*(?:\([^)]*\))?\s*[,;]?\s*$/);
            if (enumValue && !isUpperSnake(enumValue[1])) {
              addIssue(issues, {
                level: 'fix', line: lineNo,
                title: `enum定数「${enumValue[1]}」は UPPER_SNAKE_CASE にしてください`,
                suggestion: `例: ${toUpperSnake(enumValue[1])}`
              });
            }
          }

          for (const ch of line) {
            if (ch === '{') depth++;
            if (ch === '}') depth = Math.max(0, depth - 1);
          }
          if (enumDepth != null && depth < enumDepth) enumDepth = null;
        });

        // Java string comparison with == / != when a literal or known String variable participates.
        noComments.forEach((line, index) => {
          const regex = /("(?:\\.|[^"\\])*"|[A-Za-z_$][\w$]*)\s*(==|!=)\s*("(?:\\.|[^"\\])*"|[A-Za-z_$][\w$]*)/g;
          let match;
          while ((match = regex.exec(line)) !== null) {
            const left = match[1];
            const right = match[3];
            const isStringSide = left.startsWith('"') || right.startsWith('"') || stringVars.has(left) || stringVars.has(right);
            if (isStringSide) {
              addIssue(issues, {
                level: 'fix', line: index + 1,
                title: 'Stringの比較に == / != が使われています',
                message: 'Javaの == / != は文字列内容ではなく参照を比較します。',
                suggestion: 'equals / Objects.equals など、意図に合う比較を使用してください。'
              });
              break;
            }
          }
        });
      }

      function analyzeJava(lex, issues) {
        const { structural, noComments } = lex;

        structural.forEach((line, index) => {
          const lineNo = index + 1;
          if (/\bSystem\.out\.println\s*\(/.test(line)) {
            addIssue(issues, {
              level: 'warn', line: lineNo,
              title: 'System.out.println が残っています',
              suggestion: 'デバッグ出力の消し忘れでないか確認してください。必要ならプロジェクトのロガーを使用します。'
            });
          }
          if (/\.printStackTrace\s*\(/.test(line)) {
            addIssue(issues, {
              level: 'warn', line: lineNo,
              title: 'printStackTrace() が残っています',
              suggestion: '例外の扱い方やプロジェクトのログ方針に合わせて処理してください。'
            });
          }
          if (/\bcatch\s*\(\s*Exception\b/.test(line)) {
            addIssue(issues, {
              level: 'info', line: lineNo,
              title: 'Exception を広く catch しています',
              suggestion: '必要に応じて、より具体的な例外型を扱えないか確認してください。'
            });
          }
        });

        const joined = structural.join('\n');
        const emptyCatchRegex = /catch\s*\([^)]*\)\s*\{\s*\}/g;
        let match;
        while ((match = emptyCatchRegex.exec(joined)) !== null) {
          const line = joined.slice(0, match.index).split('\n').length;
          addIssue(issues, {
            level: 'fix', line,
            title: '空の catch ブロックがあります',
            suggestion: '例外を握りつぶす意図が明確でない場合は、適切な処理・ログ・再throwを検討してください。'
          });
        }
      }

      function analyzeJavaScriptNaming(lex, issues) {
        const { structural, noComments } = lex;
        let depth = 0;

        structural.forEach((line, index) => {
          const original = noComments[index];
          const lineNo = index + 1;
          const startDepth = depth;

          const declarations = Array.from(line.matchAll(/\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*(?:=\s*([^,;]+))?/g));
          for (const declaration of declarations) {
            const name = declaration[1];
            const initializer = declaration[2] || '';
            const isTopLevelPrimitiveConst = startDepth === 0
              && /\bconst\b/.test(declaration[0])
              && /^(?:\s*(?:[-+]?\d+(?:\.\d+)?|true|false|null|undefined)\s*|\s*$)/.test(initializer);
            const constantWords = /(?:max|min|default|limit|timeout|interval|duration|retry|size|count|version|prefix|suffix)/i.test(name);
            const constantCandidate = isTopLevelPrimitiveConst && constantWords;
            checkVariableName(name, '', lineNo, original, issues, { initializer, constant: constantCandidate });

            if (constantCandidate && !isUpperSnake(name)) {
              addIssue(issues, {
                level: 'info', line: lineNo,
                title: `トップレベル定数候補「${name}」の命名を確認してください`,
                suggestion: `定数として扱う値なら ${toUpperSnake(name)} のような UPPER_SNAKE_CASE を検討してください。`
              });
            }

            if (/^\s*\[/.test(initializer) && !/(?:s|List|Array)$/.test(name)) {
              addIssue(issues, {
                level: 'info', line: lineNo,
                title: `配列変数「${name}」は複数であることが分かる名前を検討してください`,
                suggestion: '例: users / items / userIds'
              });
            }
          }

          const functionDecl = line.match(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/);
          if (functionDecl) checkMethodName(functionDecl[1], lineNo, '', '', issues);

          const arrowOrFunctionExpr = line.match(/\b(?:const|let)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:function\b|(?:\([^)]*\)|[A-Za-z_$][\w$]*)\s*=>)/);
          if (arrowOrFunctionExpr) checkMethodName(arrowOrFunctionExpr[1], lineNo, '', '', issues);

          const methodSyntax = line.match(/^\s*(?:async\s+)?([A-Za-z_$][\w$]*)\s*\([^;]*\)\s*\{/);
          if (methodSyntax && !/^(?:if|for|while|switch|catch|function)$/.test(methodSyntax[1])) {
            checkMethodName(methodSyntax[1], lineNo, '', '', issues);
          }

          for (const ch of line) {
            if (ch === '{') depth++;
            if (ch === '}') depth = Math.max(0, depth - 1);
          }
        });
      }

      function isOperatorInsideString(lex, lineIndex, column) {
        return (lex.stringsByLine[lineIndex] || []).some(token => {
          const end = token.end == null ? Infinity : token.end;
          return column > token.start && column < end;
        });
      }

      function analyzeJsQuotes(lex, issues) {
        lex.stringsByLine.forEach((tokens, index) => {
          for (const token of tokens) {
            if (token.quote === '"') {
              addIssue(issues, {
                level: 'warn', line: index + 1,
                title: '文字列はシングルクォートを使用してください',
                message: 'ダブルクォートの文字列が使われています。',
                suggestion: "例: 'text'"
              });
            }
          }
        });
      }

      function analyzeJsEquality(lex, issues) {
        lex.structural.forEach((line, index) => {
          for (let i = 0; i < line.length - 1; i++) {
            const pair = line.slice(i, i + 2);
            if (pair !== '==' && pair !== '!=') continue;
            if (line[i + 2] === '=' || line[i - 1] === '=') continue;

            const original = lex.noComments[index];
            const left = original.slice(0, i).trimEnd();
            const right = original.slice(i + 2).trimStart();
            const nullException = /\bnull$/.test(left) || /^null\b/.test(right);
            if (!nullException) {
              addIssue(issues, {
                level: 'fix', line: index + 1,
                title: `${pair} ではなく ${pair === '==' ? '===' : '!=='} を使用してください`,
                message: '== null / != null は例外として許可しています。'
              });
            }
            i++;
          }
        });
      }

      function analyzeJsValueComparison(lex, issues) {
        lex.noComments.forEach((line, index) => {
          const patterns = [
            { regex: /([A-Za-z_$][\w$\.\[\]()]*\.value)\s*(===|!==)\s*('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`|[A-Za-z_$][\w$\.\[\]()]*(?:\([^)]*\))?|[-+]?\d+(?:\.\d+)?)/g, side: 'right' },
            { regex: /('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`|[A-Za-z_$][\w$\.\[\]()]*(?:\([^)]*\))?|[-+]?\d+(?:\.\d+)?)\s*(===|!==)\s*([A-Za-z_$][\w$\.\[\]()]*\.value)/g, side: 'left' }
          ];

          for (const config of patterns) {
            let match;
            while ((match = config.regex.exec(line)) !== null) {
              const operatorOffset = match[0].indexOf(match[2]);
              const operatorCol = match.index + operatorOffset;
              if (isOperatorInsideString(lex, index, operatorCol)) continue;
              const operand = config.side === 'right' ? match[3] : match[1];
              if (!(operand.startsWith("'") && operand.endsWith("'"))) {
                addIssue(issues, {
                  level: 'fix', line: index + 1,
                  title: '.value の比較相手はシングルクォート文字列にしてください',
                  suggestion: "例: input.value === '1' / '1' !== select.value"
                });
              }
            }
          }
        });
      }

      function analyzeJsSpacing(lex, issues) {
        lex.structural.forEach((line, index) => {
          const lineNo = index + 1;
          const keywordRegex = /\b(if|for|while|switch|catch)\s*\(/g;
          let match;
          while ((match = keywordRegex.exec(line)) !== null) {
            const full = match[0];
            const keyword = match[1];
            const between = full.slice(keyword.length, full.lastIndexOf('('));
            if (between !== ' ') {
              addIssue(issues, {
                level: 'fix', line: lineNo,
                title: `${keyword} の後ろは半角スペース1個にしてください`,
                suggestion: `例: ${keyword} (...)`
              });
              break;
            }
          }

          for (let i = 0; i < line.length; i++) {
            if (line[i] !== '{') continue;
            const before = line.slice(0, i);
            if (!before.trim()) continue;
            const prev = line[i - 1] || '';
            const prev2 = line[i - 2] || '';
            if (prev !== ' ' || prev2 === ' ' || prev === '\t') {
              addIssue(issues, {
                level: 'fix', line: lineNo,
                title: '{ の前は半角スペース1個にしてください',
                suggestion: '例: if (condition) { / function run() {'
              });
              break;
            }
          }
        });
      }

      function lineLooksLikeContinuation(line, previous) {
        const current = line.trim();
        const prev = (previous || '').trim();
        return /^(?:\.|\)|\]|&&|\|\||\?|:)/.test(current)
          || /(?:\(|\[|,|\.|\+|-|\*|\/|&&|\|\||\?|:|=|=>)$/.test(prev);
      }

      function analyzeJsIndentation(lex, issues) {
        let depth = 0;
        const switchStack = [];
        let previousCode = '';

        for (let index = 0; index < lex.structural.length; index++) {
          const structuralLine = lex.structural[index];
          const original = lex.lines[index];
          const trimmed = structuralLine.trim();
          if (!trimmed) continue;

          if (/^\s*\t+/.test(original) || /^ +\t/.test(original)) {
            addIssue(issues, {
              level: 'fix', line: index + 1,
              title: 'インデントにタブが使われています',
              suggestion: 'JavaScriptのインデントは半角スペース2個に統一してください。'
            });
          } else {
            const leading = countLeadingSpaces(original);
            const invalidIndentUnit = leading % 2 !== 0;
            if (invalidIndentUnit) {
              addIssue(issues, {
                level: 'fix', line: index + 1,
                title: 'インデントは半角スペース2個単位にしてください',
                message: `現在は先頭に ${leading} 個のスペースがあります。`
              });
            }

            const closesFirst = /^}/.test(trimmed) ? 1 : 0;
            const baseDepth = Math.max(0, depth - closesFirst);
            const currentSwitch = switchStack[switchStack.length - 1];
            const isCase = /^(?:case\b.*:|default\s*:)/.test(trimmed);
            const caseExtra = currentSwitch && currentSwitch.activeCase && baseDepth >= currentSwitch.bodyDepth && !isCase ? 1 : 0;
            const expected = (baseDepth + caseExtra) * 2;
            const continuation = lineLooksLikeContinuation(structuralLine, previousCode);

            if (!invalidIndentUnit && !continuation && leading !== expected) {
              addIssue(issues, {
                level: 'warn', line: index + 1,
                title: `インデントを ${expected} スペースに揃えてください`,
                message: `現在は ${leading} スペースです。`,
                suggestion: 'ブロックごとに半角スペース2個でインデントしてください。'
              });
            } else if (!invalidIndentUnit && continuation && leading < expected) {
              addIssue(issues, {
                level: 'warn', line: index + 1,
                title: '継続行のインデントが浅すぎます',
                suggestion: `少なくとも ${expected} スペース以上を目安にしてください。`
              });
            }
          }

          if (/\bswitch\s*\([^)]*\)\s*\{/.test(structuralLine)) {
            switchStack.push({ bodyDepth: depth + 1, activeCase: false });
          }
          const topSwitch = switchStack[switchStack.length - 1];
          if (topSwitch && depth === topSwitch.bodyDepth && /^(?:case\b.*:|default\s*:)/.test(trimmed)) {
            topSwitch.activeCase = true;
          }

          for (const ch of structuralLine) {
            if (ch === '{') depth++;
            if (ch === '}') {
              depth = Math.max(0, depth - 1);
              const last = switchStack[switchStack.length - 1];
              if (last && depth < last.bodyDepth) switchStack.pop();
            }
          }
          previousCode = structuralLine;
        }
      }

      function classifyJsOpening(line) {
        const t = line.trim();
        if (/\bfunction\s+[A-Za-z_$][\w$]*\s*\([^)]*\)\s*\{$/.test(t)) return 'function-declaration';
        if (/\b(?:const|let|var)\s+[A-Za-z_$][\w$]*\s*=\s*(?:async\s*)?function\b.*\{$/.test(t)) return 'expression';
        if (/\b(?:const|let|var)\s+[A-Za-z_$][\w$]*\s*=.*=>\s*\{$/.test(t)) return 'expression';
        if (/\b(?:const|let|var)\s+[A-Za-z_$][\w$]*\s*=\s*\{$/.test(t)) return 'expression';
        return 'block';
      }

      function likelyNeedsSemicolon(line, nextLine) {
        const t = line.trim();
        if (!t) return false;
        if (/[;,{:]$/.test(t)) return false;
        if (/\{$/.test(t)) return false;
        if (/^}/.test(t)) return false;
        if (/^(?:if|for|while|switch|try|catch|finally|else|do)\b/.test(t)) return false;
        if (/^function\b/.test(t)) return false;
        if (/^class\b/.test(t)) return false;
        if (/^(?:case\b.*:|default\s*:)/.test(t)) return false;
        if (/(?:\.|\(|\[|\+|-|\*|\/|&&|\|\||\?|:|=|=>)$/.test(t)) return false;
        if (nextLine && /^(?:\.|\)|\]|\?|:|&&|\|\|)/.test(nextLine.trim())) return false;
        if (/^(?:const|let|var|return\b|throw\b|break\b|continue\b|import\b|export\b|await\b)/.test(t)) return true;
        if (/^(?:[A-Za-z_$][\w$\.\[\]()]*\s*(?:\+\+|--|[+\-*/%]?=))/.test(t)) return true;
        if (/^(?:await\s+)?[A-Za-z_$][\w$\.\[\]]*\s*\([^)]*\)$/.test(t)) return true;
        if (/^new\s+/.test(t)) return true;
        return false;
      }

      function analyzeJsSemicolons(lex, issues) {
        const stack = [];

        for (let index = 0; index < lex.structural.length; index++) {
          const line = lex.structural[index];
          const statementLine = lex.noComments[index];
          const trimmed = line.trim();
          const next = lex.noComments[index + 1] || '';

          // Function declaration closing brace must not have a semicolon.
          if (/^}\s*;\s*$/.test(trimmed)) {
            const top = stack[stack.length - 1];
            if (top && top.type === 'function-declaration' && top.depth === stack.length) {
              addIssue(issues, {
                level: 'fix', line: index + 1,
                title: '関数宣言の末尾にはセミコロンを付けません',
                suggestion: 'function name() { ... } の閉じ波括弧の後ろの ; を削除してください。'
              });
            }
          }

          if (likelyNeedsSemicolon(statementLine, next) && !/;\s*$/.test(statementLine.trim())) {
            addIssue(issues, {
              level: 'fix', line: index + 1,
              title: '文末にセミコロンを付けてください',
              suggestion: 'この現場ではセミコロンを原則付与します。'
            });
          }

          for (let col = 0; col < line.length; col++) {
            const ch = line[col];
            if (ch === '{') {
              const before = line.slice(0, col + 1);
              stack.push({ type: classifyJsOpening(before), line: index + 1, depth: stack.length + 1 });
            } else if (ch === '}') {
              const top = stack.pop();
              const after = line.slice(col + 1).trim();
              if (top && top.type === 'expression' && (after === '' || (!after.startsWith(';') && !after.startsWith(',')))) {
                addIssue(issues, {
                  level: 'fix', line: index + 1,
                  title: '関数式・アロー関数・オブジェクト代入の末尾にセミコロンを付けてください',
                  suggestion: '代入式の終端は }; とします。'
                });
              }
              if (top && top.type === 'function-declaration' && /^;/.test(after)) {
                addIssue(issues, {
                  level: 'fix', line: index + 1,
                  title: '関数宣言の末尾にはセミコロンを付けません',
                  suggestion: '閉じ波括弧の後ろの ; を削除してください。'
                });
              }
            }
          }
        }
      }

      function analyzeJavaScript(lex, issues) {
        analyzeJsQuotes(lex, issues);
        analyzeJsEquality(lex, issues);
        analyzeJsValueComparison(lex, issues);
        analyzeJsSpacing(lex, issues);
        analyzeJsIndentation(lex, issues);
        analyzeJsSemicolons(lex, issues);

        lex.structural.forEach((line, index) => {
          if (/\bvar\b/.test(line)) {
            addIssue(issues, {
              level: 'fix', line: index + 1,
              title: 'var は禁止です',
              suggestion: '再代入しない場合は const、再代入が必要な場合は let を使用してください。'
            });
          }
          if (/\bconsole\.log\s*\(/.test(line)) {
            addIssue(issues, {
              level: 'warn', line: index + 1,
              title: 'console.log が残っています',
              suggestion: 'デバッグ出力の消し忘れでないか確認してください。'
            });
          }
          if (/\bdebugger\s*;?/.test(line)) {
            addIssue(issues, {
              level: 'fix', line: index + 1,
              title: 'debugger が残っています',
              suggestion: 'コミット前に削除してください。'
            });
          }
        });

        const joined = lex.structural.join('\n');
        let match;
        const emptyCatch = /catch\s*(?:\([^)]*\))?\s*\{\s*\}/g;
        while ((match = emptyCatch.exec(joined)) !== null) {
          const line = joined.slice(0, match.index).split('\n').length;
          addIssue(issues, {
            level: 'warn', line,
            title: '空の catch ブロックがあります',
            suggestion: '例外を意図的に無視する場合でも、理由が分かる実装にしてください。'
          });
        }
      }

      function dedupeIssues(issues) {
        const seen = new Set();
        return issues.filter(issue => {
          const key = [issue.line, issue.endLine, issue.title].join('|');
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function reviewSource(source, lang) {
        const lex = lexSource(source, lang);
        const issues = [];
        analyzeComments(lex, lang, issues);
        analyzeCommon(lex, lang, issues);
        if (lang === 'java') analyzeJava(lex, issues);
        else analyzeJavaScript(lex, issues);

        const rank = { fix: 0, warn: 1, info: 2 };
        const sorted = dedupeIssues(issues).sort((a, b) => a.line - b.line || rank[a.level] - rank[b.level] || a.title.localeCompare(b.title, 'ja'));
        return { issues: sorted, lex };
      }

      function runReview() {
        const source = els.code.value;
        updateGutter();

        if (!source.trim()) {
          lastIssues = [];
          lastLex = lexSource('', language);
          renderResults([]);
          return;
        }

        const result = reviewSource(source, language);
        lastIssues = result.issues;
        lastLex = result.lex;
        renderResults(lastIssues);
        updateGutter(lastIssues);

      }


      function categoryForIssue(issue) {
        const text = `${issue.title || ''} ${issue.message || ''}`;
        if (/(?:変数名|メソッド名|クラス名|定数|Boolean|略語|接頭辞|UPPER_SNAKE_CASE|lowerCamelCase|PascalCase)/.test(text)) return '命名';
        if (/(?:インデント|スペース|セミコロン|シングルクォート|ダブルクォート|文字列|1行が\d+文字|文末|波括弧)/.test(text)) return '書式';
        return 'コード品質';
      }

      function fixExampleForIssue(issue, snippet) {
        if (!snippet) return issue.suggestion || '';
        const title = issue.title || '';
        let example = '';

        if (title === 'var は禁止です') {
          example = snippet.replace(/\bvar\b/, 'const');
        } else if (/シングルクォート/.test(title) || /ダブルクォート/.test(title)) {
          example = snippet.replace(/"([^"\n]*)"/, "'$1'");
        } else if (/===|!==/.test(title) && /==|!=/.test(snippet)) {
          example = snippet
            .replace(/(^|[^=!])==(?!=)/g, '$1===')
            .replace(/(^|[^!])!=(?!=)/g, '$1!==');
        } else if (/キーワード.*スペース|半角スペース1個/.test(title)) {
          example = snippet.replace(/\b(if|for|while|switch|catch)\s*\(/, '$1 (');
        } else if (/波括弧|\{.*スペース/.test(title)) {
          example = snippet.replace(/\s*\{/, ' {');
        } else if (/文末にセミコロン/.test(title) && !/;\s*$/.test(snippet)) {
          example = `${snippet};`;
        } else if (/関数宣言の末尾にはセミコロン/.test(title)) {
          example = snippet.replace(/}\s*;\s*$/, '}');
        } else if (/\.value/.test(title)) {
          example = "input.value === '1'";
        }

        return example || issue.suggestion || '';
      }

      function groupIssuesByLine(issues) {
        const groups = new Map();
        for (const issue of issues) {
          const key = issue.line;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(issue);
        }
        return [...groups.entries()].map(([line, items]) => ({ line, items }));
      }

      function renderResults(issues) {
        const counts = issues.reduce((acc, issue) => {
          acc[issue.level]++;
          return acc;
        }, { fix: 0, warn: 0, info: 0 });

        els.summary.innerHTML = issues.length
          ? `<span class="count-pill fix">要修正 ${counts.fix}</span><span class="count-pill warn">警告 ${counts.warn}</span><span class="count-pill info">情報 ${counts.info}</span>`
          : '';
        els.copyBtn.disabled = issues.length === 0;

        if (!els.code.value.trim()) {
          els.resultList.innerHTML = '';
          return;
        }

        if (issues.length === 0) {
          els.resultList.innerHTML = `
            <div class="empty-state">
              <div>
                <div class="empty-icon">✓</div>
                <div class="empty-title">現在のルールでは指摘はありません</div>
              </div>
            </div>`;
          return;
        }

        const lines = els.code.value.split('\\n');
        const groups = groupIssuesByLine(issues);

        els.resultList.innerHTML = groups.map(group => {
          const snippet = lineSnippet(lines, group.line);
          const visible = group.items.slice(0, MAX_ISSUES_PER_LINE);
          const hiddenCount = Math.max(0, group.items.length - visible.length);
          const highest = visible.some(i => i.level === 'fix') ? 'fix' : visible.some(i => i.level === 'warn') ? 'warn' : 'info';

          const issueHtml = visible.map(issue => {
            const example = fixExampleForIssue(issue, snippet);
            return `
              <div class="line-issue">
                <div class="issue-meta">
                  <span class="level-chip ${issue.level}">${levelLabel(issue.level)}</span>
                  <span class="category-chip">${categoryForIssue(issue)}</span>
                </div>
                <div class="issue-title">${escapeHtml(issue.title)}</div>
                ${issue.message ? `<div class="issue-message">${escapeHtml(issue.message)}</div>` : ''}
                ${example ? `<div class="fix-example"><strong>修正例</strong>${escapeHtml(example)}</div>` : ''}
              </div>`;
          }).join('');

          return `
            <button type="button" class="line-card" data-line="${group.line}" aria-label="Line ${group.line} の指摘 ${group.items.length}件">
              <div class="line-card-head">
                <span class="line-label">L${group.line}</span>
                <span class="level-chip ${highest}">${group.items.length}件</span>
              </div>
              ${snippet ? `<pre class="line-code">${escapeHtml(snippet)}</pre>` : ''}
              <div class="line-issues">${issueHtml}</div>
              ${hiddenCount ? `<div class="more-issues">ほか ${hiddenCount} 件の指摘を省略しています</div>` : ''}
            </button>`;
        }).join('');

        els.resultList.querySelectorAll('.line-card').forEach(card => {
          card.addEventListener('click', () => jumpToLine(Number(card.dataset.line)));
        });
      }

      function updateGutter(issues = lastIssues) {
        const lineCount = Math.max(1, els.code.value.split('\n').length);
        const lineLevels = new Map();
        for (const issue of issues || []) {
          for (let line = issue.line; line <= issue.endLine; line++) {
            const current = lineLevels.get(line);
            if (!current || (current === 'info' && issue.level !== 'info') || (current === 'warn' && issue.level === 'fix')) {
              lineLevels.set(line, issue.level);
            }
          }
        }

        let html = '';
        for (let i = 1; i <= lineCount; i++) {
          const level = lineLevels.get(i);
          const cls = level ? `gutter-line has-issue has-${level}` : 'gutter-line';
          html += `<div class="${cls}">${i}</div>`;
        }
        els.gutter.innerHTML = html;
        syncGutterScroll();
      }

      function syncGutterScroll() {
        els.gutter.style.transform = `translateY(${-els.code.scrollTop}px)`;
      }

      function jumpToLine(lineNumber) {
        const source = els.code.value;
        const lines = source.split('\n');
        const clamped = Math.min(Math.max(1, lineNumber), lines.length);
        let start = 0;
        for (let i = 0; i < clamped - 1; i++) start += lines[i].length + 1;
        const end = start + lines[clamped - 1].length;
        els.code.focus();
        els.code.setSelectionRange(start, end);
        const lineHeight = parseFloat(getComputedStyle(els.code).lineHeight) || 22;
        els.code.scrollTop = Math.max(0, (clamped - 4) * lineHeight);
        syncGutterScroll();
      }

      function copyReview() {
        if (!lastIssues.length) return;
        const langLabel = language === 'java' ? 'Java' : 'JavaScript';
        const text = [
          `Code Review Checker - ${langLabel}`,
          `指摘: ${lastIssues.length}件`,
          '',
          ...lastIssues.map(issue => {
            const range = issue.endLine > issue.line ? `L${issue.line}-${issue.endLine}` : `L${issue.line}`;
            return `[${levelLabel(issue.level)}] [${categoryForIssue(issue)}] ${range} ${issue.title}${issue.suggestion ? `\n  → ${issue.suggestion}` : ''}`;
          })
        ].join('\n');

        const fallback = () => {
          const temp = document.createElement('textarea');
          temp.value = text;
          temp.style.position = 'fixed';
          temp.style.opacity = '0';
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          temp.remove();
          showToast('レビュー結果をコピーしました');
        };

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => showToast('レビュー結果をコピーしました')).catch(fallback);
        } else {
          fallback();
        }
      }

      function switchLanguage(next) {
        if (next === language) return;
        language = next;
        els.langBtns.forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.language === language)));
        if (language === 'javascript') {
          els.code.setAttribute('placeholder', 'JavaScriptコードを貼り付けてください。');
        } else {
          els.code.setAttribute('placeholder', 'Javaコードを貼り付けてください。');
        }
        runReview();
      }

      els.code.addEventListener('input', () => {
        updateGutter();
        scheduleReview();
      });

      els.code.addEventListener('scroll', syncGutterScroll, { passive: true });

      els.code.addEventListener('keydown', event => {
        if (event.key === 'Tab' && language === 'javascript') {
          event.preventDefault();
          const start = els.code.selectionStart;
          const end = els.code.selectionEnd;
          els.code.setRangeText('  ', start, end, 'end');
          els.code.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });

      els.langBtns.forEach(btn => btn.addEventListener('click', () => switchLanguage(btn.dataset.language)));

      els.clearBtn.addEventListener('click', () => {
        els.code.value = '';
        lastIssues = [];
        runReview();
        els.code.focus();
      });

      els.copyBtn.addEventListener('click', copyReview);

      els.themeToggle.addEventListener('click', () => {
        const nextTheme = getTheme() === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
      });

      // Initial state
      renderThemeToggle();
      updateGutter([]);
      renderResults([]);
    })();
  </script>
</body>
</html>
